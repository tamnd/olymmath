name: pages

# Build the site with the base path /olymmath/ and publish the mirror at https://tamnd.github.io/olymmath/.
on:
  push:
    branches: [main]
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the mirror
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: content
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/olymmath-agent
          ref: main
          path: toolchain
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: toolchain/go.mod
          cache-dependency-path: toolchain/go.sum
      - name: build om
        working-directory: toolchain
        run: go build -trimpath -o "$RUNNER_TEMP/om" ./cmd/om
      - name: build the site
        env:
          COMMIT: ${{ github.sha }}
        run: '"$RUNNER_TEMP/om" site build -content content -out _site -base /olymmath/ -commit "$COMMIT" -date now'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: publish the mirror
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

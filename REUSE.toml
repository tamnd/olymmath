version = 1

# The default for paths that a more specific entry does not cover.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 the olymmath contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["solutions/**", "README.md", "CONTRIBUTING.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 the olymmath contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [".github/**", "scripts/**", "wrangler.jsonc", "lean/checks/check.sh"]
precedence = "override"
SPDX-FileCopyrightText = "2026 the olymmath contributors"
SPDX-License-Identifier = "Apache-2.0"

# The statements of the problems are quoted from their sources. The front matter of each file names the source.
[[annotations]]
path = "problems/**"
precedence = "override"
SPDX-FileCopyrightText = "the holders named in the source of each file"
SPDX-License-Identifier = "LicenseRef-Quoted"

# The Lean files under lean/vendor are copies of open sources. Each directory is lean/vendor/<source>/<commit>/, and it keeps the LICENSE file of the source. The source register names each source. The diffs under lean/ports change those files, under the same licence.
[[annotations]]
path = ["lean/vendor/**", "lean/ports/**"]
precedence = "override"
SPDX-FileCopyrightText = "the authors of each source, as its LICENSE file says"
SPDX-License-Identifier = "Apache-2.0"

text: |-
  abbrev xyz_of_ab (a b : ℝ) : Set (ℝ × ℝ × ℝ) :=
    { p | let ⟨x,y,z⟩ := p
          (a ≠ 0 ∧
          z = (a^2 - b^2) / (2 * a) ∧
          ∀ m, (m - x) * (m - y) =
                m^2 - (a^2 + b^2) / (2 * a) * m + ((a^2 - b^2) / (2 * a))^2) ∨ (a = 0 ∧ b = 0 ∧ x  = 0 ∧ y = 0 ∧ z = 0) }

  theorem imo1961_p1b (a b x y z : ℝ) (h₀ : IsSolution a b x y z) :
      ⟨a,b⟩ ∈ ab_that_make_xyz_positive_distinct ↔
        (0 < x ∧ 0 < y ∧ 0 < z ∧ [x,y,z].Nodup)

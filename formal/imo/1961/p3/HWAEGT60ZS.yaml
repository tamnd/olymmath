  @[imo_problem_subject algebra]
  theorem imo_1961_p3 (n : ℕ) (h₀ : n > 0) :
      {x : ℝ | Real.cos x ^ n - Real.sin x ^ n = 1} =
      answer(if Even n then {(m : ℝ) * π | m : ℤ} else
        {a : ℝ | ∃ m : ℤ, a = 2 * m * π ∨ a = 2 * m * π - π / 2})

text: |-
  abbrev solutionSet (n : ℕ+) : Set ℝ :=
   { x | (∃ k : ℤ, k * π = x) ∧ Even n.val ∨ (∃ k : ℤ, k * (2 * π) = x) ∧ Odd n.val ∨
            (∃ k : ℤ, -(π / 2) + k * (2 * π) = x) ∧ Odd n.val }

  theorem imo1961_p3 {n : ℕ} {x : ℝ} (npos : 0 < n) :
      x ∈ solutionSet ⟨n, npos⟩ ↔
      (cos x) ^ n - (sin x) ^ n = 1

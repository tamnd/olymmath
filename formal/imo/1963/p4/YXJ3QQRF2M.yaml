  theorem imo_1963_p4 :
      {(x₁, x₂, x₃, x₄, x₅) |
        (x₁ : ℝ) (x₂ : ℝ) (x₃ : ℝ) (x₄ : ℝ) (x₅ : ℝ) (y : ℝ)

        {(a, a, a, a, a) | (a : ℝ)} ∪
        {(a, b, -a + y*b, -y*a - y*b, y*a - b) |
          (a : ℝ) (b : ℝ) (y : ℝ)
          (h₀ : y = (-1 + √5) / 2 ∨ y = (-1 - √5) / 2)})

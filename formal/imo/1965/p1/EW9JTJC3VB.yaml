text: |-
  @[imo_problem_subject algebra]
  theorem imo_1965_p1 :
      {x : ℝ |
          0 ≤ x ∧
            x ≤ 2 * π ∧
              2 * Real.cos x ≤
                  abs (√(1 + Real.sin (2 * x)) - √(1 - Real.sin (2 * x))) ∧
                abs (√(1 + Real.sin (2 * x)) - √(1 - Real.sin (2 * x))) ≤
                  √2} =
        answer(Set.Icc (π / 4) (7 * π / 4))

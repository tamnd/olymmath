text: |-
  noncomputable determine solution_set {a : Fin 4 → ℝ}
      (ha : Function.Injective a) : Set ((Fin 4 → ℝ)) :=
    solution_set_generalized (by norm_num : 2 ≤ 4) ha

  theorem imo1966_p5
      (x a : Fin 4 → ℝ)
      (ha : Function.Injective a) :
      (∀ i : Fin 4, ∑ j : Fin 4, abs (a i - a j) * x j = 1)
      ↔ x ∈ solution_set ha

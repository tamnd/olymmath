text: |-
  @[imo_problem_subject algebra]
  theorem imo_1967_p6 (m n : ℕ) (medals : ℕ → ℕ) (h₀ : n > 1) (h₁ : (Finset.Icc 1 n).sum medals = m)
      (h₂ :
        ∀ d ∈ Finset.Icc 1 n,
          7 ∣ m - d - (Finset.Ico 1 d).sum medals ∧
            medals d = d + (m - d - (Finset.Ico 1 d).sum medals) / 7)
      (h₃ : medals n = n) : m = 36 ∧ n = 6

text: "@[imo_problem_subject algebra]\ntheorem imo_1968_p5 :\n    (∀\n      (f : ℝ → ℝ) (a : ℝ) (ha : 0 < a)\n      (hnn : ∀ x, 0 ≤ f x - f x ^ 2)                                              \n      (hf : ∀ x, f (x + a) = 1 / 2 + √(f x - f x ^ 2)),\n      ∃ b > 0, f.Periodic b) ∧\n                         \n    Set.piecewise (⋃ n : ℤ, Set.Ico (2 * n : ℝ) (2 * n + 1)) (1 : ℝ → ℝ) (1 / 2) ∈\n      {f : ℝ → ℝ |\n        ∃ (a : ℝ) (ha : 0 < a) (hnn : ∀ x, 0 ≤ f x - f x ^ 2)\n          (hf : ∀ x, f (x + a) = 1 / 2 + √(f x - f x ^ 2)),\n                                           \n          a = 1 ∧ ∀ c, f ≠ Function.const _ c}"

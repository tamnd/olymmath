text: |-
  abbrev eqCondition (x₁ x₂ y₁ y₂ z₁ z₂ : ℝ) : Prop := x₁ = x₂ ∧ y₁ = y₂ ∧ z₁ = z₂

  theorem imo1969_p6 (x₁ x₂ y₁ y₂ z₁ z₂ : ℝ)
      (hx₁ : 0 < x₁) (hx₂ : 0 < x₂)
      (h₁ : z₁ ^ 2 < x₁ * y₁) (h₂ : z₂ ^ 2 < x₂ * y₂) :
      8 / ((x₁ + x₂) * (y₁ + y₂) - (z₁ + z₂) ^ 2) ≤
          1 / (x₁ * y₁ - z₁ ^ 2) + 1 / (x₂ * y₂ - z₂ ^ 2) ∧
        (8 / ((x₁ + x₂) * (y₁ + y₂) - (z₁ + z₂) ^ 2) =
            1 / (x₁ * y₁ - z₁ ^ 2) + 1 / (x₂ * y₂ - z₂ ^ 2) ↔
          eqCondition x₁ x₂ y₁ y₂ z₁ z₂)

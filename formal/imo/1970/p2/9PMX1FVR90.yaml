  @[imo_problem_subject number_theory]
  theorem imo_1970_p2 (a b n A A' B B' : ℕ) (x : ℕ → ℕ) (h₀ : 1 < n ∧ 1 < a ∧ 1 < b) (h₁ : x n ≠ 0)

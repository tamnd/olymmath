      (hA' : A' = ∑ i ∈ Finset.range n, x i * a ^ i)
      (hB : B = ∑ i ∈ Finset.range (n + 1), x i * b ^ i)
      (hB' : B' = ∑ i ∈ Finset.range n, x i * b ^ i) : A' * B < A * B' ↔ b < a

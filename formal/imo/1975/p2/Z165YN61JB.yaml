text: |-
  theorem imo1975_p2 (a : ℕ → ℤ)
      (apos : ∀ i : ℕ, 0 < a i)
      (ha : ∀ i : ℕ, a i < a (i + 1))
      : ∀ i n0 : ℕ,
        ∃ n, n0 ≤ n ∧
        ∃ r s : ℕ,
        ∃ j : ℕ,
          a n = r * a i + s * a j ∧
          i < j ∧
          0 < r ∧
          0 < s

text: |-
  @[imo_problem_subject combinatorics]
  theorem imo_1979_p6
      (A E : Fin 8)
      (hE : E = A + 4)
      (a : ℕ → ℕ)
      (ha_def : ∀ n, a n =
        Fintype.card {p : Fin n → ℤˣ // A + ∑ i, (p i : Fin 8) = E})
      (n : ℕ) (hn : 0 < n) :
      a (2*n - 1 : ℕ) = 0 ∧
      a (2 * n) = (2 + √2)^(n - 1 : ℕ) / √2 - (2 - √2)^(n - 1 : ℕ) / √2

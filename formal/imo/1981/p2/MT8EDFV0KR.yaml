text: "@[imo_problem_subject combinatorics]\ntheorem imo_1981_p2 (F : ℕ → ℕ → ℚ)\n    (h₀ :\n      ∀ (r n : ℕ) (S : Finset (Finset ℕ)) (h₁ : 1 ≤ r ∧ r ≤ n)\n        (h₂ : S = (Finset.Icc 1 n).powersetCard r),\n                                                 \n          F n r = (∑ s ∈ S, s.min.untopD 0) / S.card) :\n    ∀ n r, 1 ≤ r ∧ r ≤ n → F n r = (n + 1) / (r + 1)"

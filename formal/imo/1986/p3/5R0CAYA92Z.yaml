text: "@[imo_problem_subject combinatorics]\ntheorem imo_1986_p3\n                                                                                                                                               \n  {move : (Fin 5 → ℤ) → Fin 5 → Fin 5 → ℤ}\n  {move_def : ∀ (i : Fin 5) (n : Fin 5 → ℤ),\n    move n i = fun j =>\n      if j = i-1 then n (i-1) + n i else\n      if j = i then - n i else\n      if j = i+1 then n (i+1) + n i else\n      n j} :\n                                                                                                  \n    (                                                                      \n    ∀ (n : Fin 5 → ℤ), 0 < ∑ i, n i →\n                                                                                                         \n                                                                                                              \n      ∀ (m : ℕ → Fin 5), (∀ i, ((List.range i).map m).foldl move n (m i) < 0) → False) ↔\n    answer(True)"

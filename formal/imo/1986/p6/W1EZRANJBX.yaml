text: |-
  abbrev does_exist : Bool := true

  theorem imo1986_p6 (S : Finset (ℤ × ℤ)) :
      if does_exist then
        ∃ ε : ℤ × ℤ → ℤ,
          (∀ p ∈ S, ε p = 1 ∨ ε p = -1) ∧
          (∀ x : ℤ, |∑ p ∈ S.filter (fun p => p.1 = x), ε p| ≤ 1) ∧
          (∀ y : ℤ, |∑ p ∈ S.filter (fun p => p.2 = y), ε p| ≤ 1)
      else
        ¬ ∃ ε : ℤ × ℤ → ℤ,
          (∀ p ∈ S, ε p = 1 ∨ ε p = -1) ∧
          (∀ x : ℤ, |∑ p ∈ S.filter (fun p => p.1 = x), ε p| ≤ 1) ∧
          (∀ y : ℤ, |∑ p ∈ S.filter (fun p => p.2 = y), ε p| ≤ 1)

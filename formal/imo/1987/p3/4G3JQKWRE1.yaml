text: "@[imo_problem_subject algebra]\ntheorem imo_1987_p3\n    (n : ℕ) (h₀ : 1 ≤ n) (x : ℕ → ℝ) (h₁ : ∑ i ∈ Finset.Icc 1 n, x i ^ 2 = 1)\n    (k : ℕ)\n    (h₂ : 2 ≤ k) :\n                                              \n    ∃ a : ℕ → ℤ,\n                     \n      (∃ j ∈ Finset.Icc 1 n, a j ≠ 0) ∧\n                                             \n      (∀ i ∈ Finset.Icc 1 n, |a i| ≤ k - 1) ∧\n                                                                        \n      (|∑ i ∈ Finset.Icc 1 n, ↑(a i) * x i| ≤ (k - 1) * √↑n / (k ^ n - 1))"

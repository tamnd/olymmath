text: "@[imo_problem_subject combinatorics]\ntheorem imo_1988_p2 :\n    {(n) | (n : ℕ) (h₀ : 0 < n)\n                                                              \n      (A : Fin (2 * n + 1) → Finset ℕ)\n      (B : Finset ℕ)\n      (h₀ : ∀ i, A i ⊆ B)\n                                                    \n      (h₁ : ∀ i, (A i).card = 2 * n)\n                                                                                              \n      (h₂ : ∀ i j, i ≠ j → (A i ∩ A j).card = 1)\n                                                                           \n      (h₃ : ∀ x ∈ B, ∃ i j, i ≠ j ∧ x ∈ A i ∧ x ∈ A j)\n                                                            \n      (h₅ : ∃ f : ℕ → ℕ, (∀ x : ℕ, x ∈ B → f x = 0 ∨ f x = 1) ∧\n        ∀ i, ((A i).filter (f · = 0)).card = n)} =\n    answer({n : ℕ | 0 < n ∧ 2 ∣ n})"

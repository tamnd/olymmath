text: "@[imo_problem_subject algebra]\ntheorem imo_1988_p4 (S : Set ℝ)\n                                                            \n    (h₁ :\n      S =\n        {x : ℝ |\n          (¬∃ n : ℕ, n ∈ Finset.Icc (1 : ℕ) 70 ∧ x = n) ∧\n            5 / 4 ≤ ∑ k ∈ Finset.Icc (1 : ℕ) 70, (k : ℝ) / (x - k)}) :\n                             \n    ∃ l r : ℕ → ℝ, ∃ n : ℕ,\n                            \n      (∀ k, k < n → l k < r k) ∧\n      (∀ k, k < n - 1 → r k < l (k + 1)) ∧\n                                 \n      ∑ k ∈ Finset.range n, (r k - l k) = 1988 ∧\n                                                                                                        \n                                                                                            \n      S = ⋃ k ∈ Finset.range n, Set.Ioc (l k) (r k)"

text: |-
  theorem imo1988_p4 :
      ∃ (n : ℕ) (I : Fin n → Set ℝ),
        (∀ i, (I i).OrdConnected) ∧
        (Pairwise fun i j ↦ Disjoint (I i) (I j)) ∧
        (⋃ i, I i) =
          {x : ℝ | (5 : ℝ) / 4 ≤ ∑ k ∈ Finset.Icc (1 : ℕ) 70, (k : ℝ) / (x - k)} ∧
        ∑ i, MeasureTheory.volume (I i) = 1988

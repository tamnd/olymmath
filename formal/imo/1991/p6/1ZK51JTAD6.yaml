text: |-
  noncomputable determine solution (a : ℝ) (ha : 1 < a) : ℕ → ℝ :=
    fun n => (2*√2 + 2) * Int.fract (√2 * n)

  theorem imo1991_p6 (a : ℝ) (ha : 1 < a) :
      Bounded (solution a ha) ∧
      ∀ i j, i ≠ j →
        1 ≤ |solution a ha i - solution a ha j| * |(i:ℝ) - j|^a

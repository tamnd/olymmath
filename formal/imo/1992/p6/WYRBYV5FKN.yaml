text: |-
  @[imo_problem_subject algebra]
  theorem imo_1992_p6 (S : ℕ → ℕ) (p : ℕ → ℕ → Prop)
      (hₚ :
        ∀ n a,
          p n a =
            ∀ k, 0 < k ∧ k ≤ a → ∃ f : ℕ → ℕ, (∀ x, f x > 0) ∧ ∑ i ∈ Finset.range k, f i ^ 2 = n ^ 2)
      (h₁ : ∀ n > 0, p n (S n) ∧ ¬∃ m > S n, p n m) (n : ℕ) (h₂ : 4 ≤ n) :
      S n ≤ n ^ 2 - 14 ∧ (∃ m, 0 < m ∧ S m = m ^ 2 - 14) ∧ {m | S m = m ^ 2 - 14}.Infinite

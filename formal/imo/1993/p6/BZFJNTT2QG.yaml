text: "@[imo_problem_subject combinatorics]\ntheorem imo_1993_p6 (n : ℕ) (h₀ : n > 1) [NeZero n]\n                                 \n    (lamps : ℕ → Fin n → Bool)\n    (h₁ : lamps 0 = ⊤)\n    (h₂ :\n      ∀ t > 0,\n        lamps t =\n          ite (lamps (t - 1) (t - 1 : ℕ) = true)\n            (Function.update (lamps (t - 1)) t (!lamps (t - 1) t))\n            (lamps (t - 1))) :\n    (∃ M : ℕ, 0 < M ∧ lamps M = ⊤) ∧\n      ((∃ k : ℕ, n = 2 ^ k) → lamps (n ^ 2 - 1) = ⊤) ∧\n        ((∃ k : ℕ, n = 2 ^ k + 1) → lamps (n ^ 2 - n + 1) = ⊤)"

text: |-
  @[imo_problem_subject number_theory]
  theorem imo_1994_p3 (f : ℕ → ℕ)
      (h₀ : ∀ k, 0 < k →
        f k = ((Finset.Icc (k + 1) (2 * k)).filter fun n => (Nat.digits 2 n).count 1 = 3).card) :
      (∀ m, 0 < m → ∃ k, 0 < k ∧ f k = m) ∧
        {m | 0 < m ∧ ∃! k, 0 < k ∧ f k = m} =
          answer({a*(a - 1) / 2 + 1 | (a : ℕ) (h : a ≥ 2)})

text: |-
  abbrev solution (p : ℕ) : ℕ := 2 + (Nat.choose (2 * p) p - 2) / p

  theorem imo1995_p6 (p : ℕ) (hp : p.Prime) (hodd : Odd p) :
      (((Finset.Icc 1 (2 * p)).powersetCard p).filter
        (fun A ↦ p ∣ ∑ x ∈ A, x)).card = solution p

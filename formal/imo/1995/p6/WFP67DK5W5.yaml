text: "@[imo_problem_subject number_theory]\ntheorem imo_1995_p6 (p : ℕ) (h₀ : Nat.Prime p) (h₁ : Odd p) (S : Set (Finset ℕ))\n    (h₂ : S = {A : Finset ℕ | A ⊂ Finset.Icc 1 (2 * p) ∧ A.card = p ∧ p ∣ A.sum id})\n                                                                                  \n                                      \n    (h₃ : Fintype S) :\n    S.toFinset.card = 2 + (Nat.choose (2 * p) p - 2) / p"

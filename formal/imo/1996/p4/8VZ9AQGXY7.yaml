text: |-
  @[imo_problem_subject number_theory]
  theorem imo_1996_p4 :
      IsLeast
        {c : ℕ |
          ∃ a b : ℕ,
            0 < a ∧
              0 < b ∧
                (∃ x, 0 < x ∧ 15 * a + 16 * b = x ^ 2) ∧
                  (∃ x, 0 < x ∧ 16 * a - 15 * b = x ^ 2) ∧
                    min (16 * a - 15 * b) (15 * a + 16 * b) = c}
        (481 ^ 2)

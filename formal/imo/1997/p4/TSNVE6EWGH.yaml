text: "@[imo_problem_subject combinatorics]\ntheorem imo_1997_p4\n                                                                                   \n                                                              \n    (is_silver : ℕ → Matrix ℕ ℕ ℕ → Prop)\n    (h : is_silver = fun n M =>\n                                                                 \n      (∀ i j, i ∈ Finset.Icc 1 n ∧ j ∈ Finset.Icc 1 n →\n        M i j ∈ Finset.Icc 1 (2 * n - 1)) ∧\n                                               \n      (∀ i, i ∈ Finset.Icc 1 n →\n        Finset.Icc 1 (2 * n - 1) =\n          (Finset.Icc 1 n).image (M i) ∪ (Finset.Icc 1 n).image fun j => M j i)) :\n    (¬∃ M, is_silver 1997 M) ∧ {n : ℕ | ∃ M, is_silver n M}.Infinite"

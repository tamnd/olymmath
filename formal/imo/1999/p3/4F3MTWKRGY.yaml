text: |-
  abbrev solution_value (n : ℕ) : ℕ := n * (n + 2) / 4

  theorem imo1999_p3 (n : ℕ) (h_pos : 0 < n) (h_even : Even n) :
    IsLeast
      {k : ℕ | ∃ s : Finset (Square n), IsValidMarking s ∧ s.card = k}
      (solution_value n)

text: "@[imo_problem_subject combinatorics]\ntheorem imo_2002_p1 (n : ℕ) (h₀ : 0 < n) (S : Finset (ℕ × ℕ)) (h₁ : ∀ x y, (x, y) ∈ S ↔ x + y < n)\n                             \n    (red : ℕ × ℕ → Prop)\n                                                                                  \n                                                                                    \n                                     \n    (h₂ : ∀ (x₁ y₁ x₂ y₂ : ℕ) (h : red (x₁, y₁) ∧ x₂ ≤ x₁ ∧ y₂ ≤ y₁), red (x₂, y₂))\n                                                                            \n    (A : Finset (Finset (ℕ × ℕ)))\n    (h₃ :\n      ∀ C,\n        C ∈ A ↔\n          C ⊆ S ∧\n            C.card = n ∧\n              (∀ c ∈ C, ¬red c) ∧\n                ∀ (x₁ y₁ x₂ y₂) (h : (x₁, y₁) ∈ C ∧ (x₂, y₂) ∈ C ∧ x₁ = x₂), y₁ = y₂)\n                                                                            \n    (B : Finset (Finset (ℕ × ℕ)))\n    (h₄ :\n      ∀ C,\n        C ∈ B ↔\n          C ⊆ S ∧\n            C.card = n ∧\n              (∀ c ∈ C, ¬red c) ∧\n                ∀ (x₁ y₁ x₂ y₂) (h : (x₁, y₁) ∈ C ∧ (x₂, y₂) ∈ C ∧ y₁ = y₂), x₁ = x₂) :\n    A.card = B.card"

text: |-
  @[imo_problem_subject number_theory]
  theorem imo_2003_p2 :
      {(a, b) |
        (a : ℤ) (b : ℤ)
        (h₀ : 0 < a ∧ 0 < b)
        (h₁ : ∃ c : ℤ, 0 < c ∧ (a^2 : ℚ)/(2*a*(b^2) - b^3 + 1) = c)} =
      answer({(a, b) |
        (a : ℤ) (b : ℤ)
        (h₀ : ∃ n > 0,
          ((a = 2*n ∧ b = 1) ∨
          (a = n ∧ b = 2*n) ∨
          (a = 8*n^4 - n ∧ b = 2*n)))} )

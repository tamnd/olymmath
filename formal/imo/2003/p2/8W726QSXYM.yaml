text: |-
  abbrev solution_set : Set (ℤ × ℤ) := {(a, b) | ∃ n : ℤ, 0 < n ∧ a = 2 * n ∧ b = 1}
    ∪ {(a, b) | ∃ n : ℤ, 0 < n ∧ a = n ∧ b = 2 * n}
    ∪ {(a, b) | ∃ n : ℤ, 0 < n ∧ a = 8 * n ^ 4 - n ∧ b = 2 * n}

  theorem imo2003_p2 (a b : ℤ) :
      (a,b) ∈ solution_set ↔
      0 < a ∧ 0 < b ∧
      ∃ c, 0 < c ∧ c * (2 * a * b^2 - b^3 + 1) = a^2

text: |-
  @[imo_problem_subject algebra]
  theorem imo_2008_p2 :
      (∀ x y z : ℝ, x ≠ 1 ∧ y ≠ 1 ∧ z ≠ 1 → x * y * z = 1 →
        x ^ 2 / (x - 1) ^ 2 + y ^ 2 / (y - 1) ^ 2 + z ^ 2 / (z - 1) ^ 2 ≥ 1) ∧
      Set.Infinite {
        (x, y, z) |
        (x : ℚ) (y : ℚ) (z : ℚ)
        (_ : x ≠ 1 ∧ y ≠ 1 ∧ z ≠ 1)
        (_ : x * y * z = 1)
        (_ : x ^ 2 / (x - 1) ^ 2 + y ^ 2 / (y - 1) ^ 2 + z ^ 2 / (z - 1) ^ 2 = 1)
      }

text: |-
  abbrev solution_set : Set (PosReal → PosReal) := { f | f = id ∨ f = fun x ↦ 1 / x }

  theorem imo2008_p4 (f : PosReal → PosReal) :
      f ∈ solution_set ↔
        ∀ w x y z, w * x = y * z →
         ((f w)^2 + (f x)^2) * (y^2 + z^2) = (w^2 + x^2) * (f (y^2) + f (z^2))

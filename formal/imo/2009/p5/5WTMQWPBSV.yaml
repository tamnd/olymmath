text: |-
  @[imo_problem_subject algebra]
  theorem imo_2009_p5 :
      { f : ℕ → ℕ | (∀ n > 0, 0 < f n) ∧
        ∀ a b : ℕ, 0 < a → 0 < b →
          a + f b > f (b + f a - 1 : ℕ) ∧
          f b + f (b + f a - 1 : ℕ) > a ∧
          f (b + f a - 1 : ℕ) + a > f b
      } = answer({ f | ∀ n > 0, f n = n })

text: "@[imo_problem_subject algebra]\ntheorem imo_2010_p6 (a : ℕ → ℝ) (s : ℕ) (h₀ : 0 < s) (h₁ : ∀ i, 0 < a i)\n    (h₂ : ∀ n > s, IsGreatest {a k + a (n - k) | (k : ℕ) (h : 1 ≤ k ∧ k ≤ n - 1)} (a n)) :\n                                                                               \n                                                                            \n    ∃ l N : ℕ, 0 < l ∧ l ≤ s ∧ l < N ∧ ∀ n ≥ N, a n = a l + a (n - l)"

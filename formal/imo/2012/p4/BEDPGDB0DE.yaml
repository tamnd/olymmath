text: |-
  @[imo_problem_subject algebra]
  theorem imo_2012_p4 :
      { f : ℤ → ℤ | ∀ a b c, a + b + c = 0 →
        f a ^ 2 + f b ^ 2 + f c ^ 2 = 2 * f a * f b + 2 * f b * f c + 2 * f c * f a
      } = answer(
        { fun x ↦ k * x ^ 2 | (k : ℤ) } ∪
        { fun x ↦ if Even x then 0 else k | (k : ℤ) } ∪
        { fun x ↦ if 4 ∣ x then 0 else if Odd x then k else 4 * k | (k : ℤ) }
      )

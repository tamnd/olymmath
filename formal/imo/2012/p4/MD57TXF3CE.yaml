text: |-
  abbrev solution_set : Set (ℤ → ℤ) := odd_const ∪ mod4_cycle ∪ square_set

  theorem imo2012_p4 (f : ℤ → ℤ) :
      f ∈ solution_set ↔
      ∀ a b c : ℤ, a + b + c = 0 →
        (f a)^2 + (f b)^2 + (f c)^2 =
          2 * f a * f b + 2 * f b * f c + 2 * f c * f a

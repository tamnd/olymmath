text: |-
  @[imo_problem_subject number_theory]
  theorem imo_2012_p6 :
      {n : ℕ | 0 < n ∧ ∃ a : ℕ → ℕ,
        1 = ∑ i ∈ Finset.Icc 1 n, (1 : ℚ) / 2 ^ a i ∧
        1 = ∑ i ∈ Finset.Icc 1 n, (i : ℚ) / 3 ^ a i} =
      answer({n : ℕ | n % 4 = 1 ∨ n % 4 = 2})

text: |-
  theorem imo2014_p6 :
      ∃ N : ℕ, ∀ n ≥ N, ∀ L : Finset Line, L.card = n → GeneralPosition L →
        ∃ B : Finset Line, B ⊆ L ∧ Real.sqrt n ≤ B.card ∧
          ∀ σ : Line → Bool, (Cell L σ).Nonempty → Bornology.IsBounded (Cell L σ) →
            ¬ (frontier (Cell L σ) ⊆ ⋃ ℓ ∈ B, ℓ.set)

text: "@[imo_problem_subject combinatorics]\ntheorem imo_2017_p3 :\n                                                                              \n    (∃ B : (ℕ → ℝ²) → ℕ → ℝ²,\n                                                                     \n                                         \n      (∀ P, B P 0 = P 0) ∧\n                                                       \n      (∀ P i, dist (B P i) (B P (i + 1)) = 1) ∧\n                                                      \n      (∀ (P1 : ℕ → ℝ²) (P2 : ℕ → ℝ²) (n), (∀ i ≤ n, P1 i = P2 i) → B P1 n = B P2 n) ∧\n                                                         \n      ∀ (A : ℕ → ℝ²) (P : ℕ → ℝ²), (\n                                                   \n        (∀ i, dist (A i) (A (i + 1)) = 1) ∧\n                                                                            \n        (∀ i, i ≠ 0 → dist (A i) (P i) ≤ 1) ∧\n                                                                        \n        A 0 = P 0) →\n                                   \n      dist (A (10 ^ 9)) (B P (10 ^ 9)) ≤ 100) ↔\n                    \n    answer(False)"

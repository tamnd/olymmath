text: |-
  abbrev does_exist : Bool := false

  theorem imo2017_p3 :
      if does_exist then
        ∃ σ : Strategy, ValidStrategy σ ∧
          ∀ A p : ℕ → Pt, ValidRabbit A → ValidReports A p →
            dist (A totalRounds) (hunterPos σ p totalRounds) ≤ 100
      else
        ¬ ∃ σ : Strategy, ValidStrategy σ ∧
          ∀ A p : ℕ → Pt, ValidRabbit A → ValidReports A p →
            dist (A totalRounds) (hunterPos σ p totalRounds) ≤ 100

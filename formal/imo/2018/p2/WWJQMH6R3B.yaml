text: |-
  @[imo_problem_subject algebra]
  theorem imo_2018_p2 (n : ℕ) (h₀ : 3 ≤ n) :
      (∃ a : ℕ → ℝ,
          a (n + 1) = a 1 ∧
          a (n + 2) = a 2 ∧
          ∀ i : ℕ, 0 < i → i ≤ n → a i * a (i + 1) + 1 = a (i + 2)) ↔
      answer(3 ∣ n)

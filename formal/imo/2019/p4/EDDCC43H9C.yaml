text: |-
  abbrev solution_set : Set (ℕ × ℕ) := { (1,1), (2,3) }

  theorem imo2019_p4 (n k : ℕ) :
      (n, k) ∈ solution_set ↔
      0 < n ∧ 0 < k ∧
      (k ! : ℤ) = ∏ i ∈ Finset.range n, ((2:ℤ)^n - (2:ℤ)^i)

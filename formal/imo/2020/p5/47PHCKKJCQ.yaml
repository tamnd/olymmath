text: "@[imo_problem_subject number_theory]\ntheorem imo_2020_p5 :\n    {n : ℕ | 1 < n ∧\n                                                 \n      ∀ (value : Fin n → ℕ+)\n        (h : ∀ i j : Fin n, i ≠ j →\n          ∃ cs : Finset (Fin n), cs.Nonempty ∧\n                                          \n            (value i + value j : ℝ) / 2 = (∏ c ∈ cs, value c) ^ (cs.card⁻¹ : ℝ)),\n                                             \n        ∃ v, value = Function.const _ v} =\n                               \n    answer(Set.Ioi 1)"

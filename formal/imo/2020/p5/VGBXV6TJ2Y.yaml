text: |-
  abbrev SolutionSet : Set ℕ := {n | 1 < n}

  theorem imo2020_p5 (n : ℕ) :
      n ∈ SolutionSet ↔
      (1 < n ∧
       (∀ f : Fin n → ℕ+,
          (Pairwise fun a b ↦ ∃ s : Finset (Fin n),
            s.Nonempty ∧ geometric_mean f s = (((f a):ℝ) + f b) / 2)
          → ∃ y, ∀ a, f a = y ))

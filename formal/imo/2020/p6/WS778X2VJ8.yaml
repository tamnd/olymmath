text: |-
  theorem imo2020_p6 : ∃ c : ℝ, 0 < c ∧ ∀ {n : ℕ}, 1 < n → ∀ {S : Finset P}, #S = n →
      ((S : Set P).Pairwise fun x y ↦ 1 ≤ dist x y) →
      ∃ l : AffineSubspace ℝ P, finrank ℝ l.direction = 1 ∧
        (∃ p₁ ∈ S, ∃ p₂ ∈ S, l.SOppSide p₁ p₂) ∧
        ∀ p ∈ S, c * (n : ℝ) ^ (-1 / 3 : ℝ) ≤ Metric.infDist p l

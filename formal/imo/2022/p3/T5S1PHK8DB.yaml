text: "@[imo_problem_subject number_theory]\ntheorem imo_2022_p3\n                                    \n    (k : ℕ) (hk : 0 < k)\n                                                   \n    (S : Finset ℕ) (hs : ∀ n ∈ S, n.Prime ∧ Odd n)\n                                                   \n    (same : Setoid (Fin S.card → ℕ))\n    (hRel_iff : ∀ x y, same.r x y ↔ (∃ i : Fin S.card, x ∘ (i + ·) = y) ∨ (∃ i, x ∘ (i - ·) = y) ∨ S.card = 0)\n                                                                                                                                 \n    (sols : Set (Quotient same))\n    (hS : ∀ p : Fin S.card → ℕ,\n      ⟦p⟧ ∈ sols ↔ Set.range p = S ∧ ∀ i, ∃ x, p i * p (finRotate _ i) = x^2 + x + k) :\n                                \n  Cardinal.mk sols ≤ 1"

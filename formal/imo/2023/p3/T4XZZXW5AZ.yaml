text: |-
  abbrev SolutionSet {k : ℕ} (hk : 2 ≤ k) : Set (ℕ+ → ℕ+) :=
    {a | ∃ a₀ d : ℕ, ∀ m : ℕ, (a ⟨m + 1, Nat.succ_pos m⟩).val = a₀ + d * m}

  snip begin

  theorem imo2023_p3 {k : ℕ} (hk : 2 ≤ k) (a : ℕ+ → ℕ+) :
      a ∈ SolutionSet hk ↔
      (∃ P : Polynomial ℤ, P.Monic ∧ P.degree = k ∧
       (∀ n, n ≤ k → 0 ≤ P.coeff n) ∧
        ∀ n : ℕ+,
          P.eval ((a n) : ℤ) =
          ∏ i ∈ Finset.range k, a ⟨n + i + 1, Nat.succ_pos _⟩)

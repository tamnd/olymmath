text: |-
  abbrev solutionSet : Set ℝ := {α : ℝ | ∃ m : ℤ, α = 2 * m}

  theorem imo2024_p1 (α : ℝ) :
    α ∈ solutionSet ↔
    ∀ n : ℕ, 0 < n → (n : ℤ) ∣ ∑ i ∈ Finset.Icc 1 n, ⌊i * α⌋

text: |-
  theorem putnam_1965_a6
      (u v m : ℝ)
      (hu : 0 < u)
      (hv : 0 < v)
      (hm : 1 < m) :
      (∃ᵉ (x > 0) (y > 0),
        u * x + v * y = 1 ∧
        x ^ m + y ^ m = 1 ∧
        u = x ^ (m - 1) ∧
        v = y ^ (m - 1)) ↔
      ∃ n, u ^ n + v ^ n = 1 ∧ m⁻¹ + n⁻¹ = 1

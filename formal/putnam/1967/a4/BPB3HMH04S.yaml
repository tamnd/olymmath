  theorem putnam_1967_a4
  (lambda : ℝ)
  (hlambda : lambda > 1 / 2)
  : ¬∃ u : ℝ → ℝ, MeasureTheory.IntegrableOn u (Set.Icc 0 1) ∧ ∀ x ∈ Set.Icc 0 1, u x = 1 + lambda * (∫ y in Set.Ioo x 1, u y * u (y - x))

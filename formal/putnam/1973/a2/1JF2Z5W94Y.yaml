text: "abbrev putnam_1973_a2_solution : Prop := sorry\n\ntheorem putnam_1973_a2\n(L : List ℝ)\n(hL : L.length = 8 ∧ ∀ i : Fin L.length, L[i] = 1 ∨ L[i] = -1)\n(pluses : ℕ)\n(hpluses : pluses = {i : Fin L.length | L[i] = 1}.ncard)\n(S : ℕ → ℝ)\n(hS : S = fun n : ℕ ↦ ∑ i ∈ Finset.Icc 1 n, L[i % 8]/i)\n: (pluses = 4 → ∃ l : ℝ, Tendsto S atTop (\U0001D4DD l)) ∧ (putnam_1973_a2_solution ↔ ((∃ l : ℝ, Tendsto S atTop (\U0001D4DD l)) → pluses = 4))"

text: |-
  theorem putnam_1973_a6
  (nint : ℕ → (Fin 7 → (ℝ × ℝ)) → ℕ)
  (h_nint : nint = fun n lines => {p : ℝ × ℝ | ∃! S : Set (Fin 7), S.ncard = n ∧ p ∈ ⋂ i ∈ S, {pts | pts.2 = (lines i).1 * pts.1 + (lines i).2}}.ncard)
  : ¬ ∃ lines : Fin 7 → (ℝ × ℝ), (∀ i j : Fin 7, i ≠ j → lines i ≠ lines j) ∧ nint 3 lines ≥ 6 ∧ nint 2 lines ≥ 4

text: "theorem putnam_1978_b3\n(P : ℕ+ → Polynomial ℝ)\n(hP1 : P 1 = 1 + X)\n(hP2 : P 2 = 1 + 2 * X)\n(hPodd : ∀ n, P (2 * n + 1) = P (2 * n) + C ((n : ℝ) + 1) * X * P (2 * n - 1))\n(hPeven : ∀ n, P (2 * n + 2) = P (2 * n + 1) + C ((n : ℝ) + 1) * X * P (2 * n))\n(a : ℕ+ → ℝ)\n(haroot : ∀ n, (P n).eval (a n) = 0)\n(haub : ∀ n, ∀ x, (P n).eval x = 0 → x ≤ a n)\n: (StrictMono a ∧ Tendsto a atTop (\U0001D4DD 0))"

text: |-
  abbrev putnam_1983_b2_solution : Prop := sorry

  theorem putnam_1983_b2
      (f : ℕ+ → ℕ)
      (hf : f = fun (n : ℕ+) ↦
        Set.ncard {M : Multiset ℕ |
          (∀ m ∈ M, ∃ k : ℕ, m = (2 ^ k : ℤ)) ∧
          (∀ m ∈ M, M.count m ≤ 3) ∧
          (M.sum : ℤ) = n}) :
      putnam_1983_b2_solution ↔
        (∃ p : Polynomial ℝ, ∀ n : ℕ+, ⌊p.eval (n : ℝ)⌋ = f n)

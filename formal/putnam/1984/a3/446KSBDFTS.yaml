text: "noncomputable abbrev putnam_1984_a3_solution : MvPolynomial (Fin 3) ℝ := sorry\n\ntheorem putnam_1984_a3\n(n : ℕ)\n(a b : ℝ)\n(Mn : ℝ → Matrix (Fin (2 * n)) (Fin (2 * n)) ℝ)\n(polyabn : Fin 3 → ℝ)\n(npos : n > 0)\n(aneb : a ≠ b)\n(hMn : Mn = fun x : ℝ => fun i j : Fin (2 * n) => if i = j then x else if Even (i.1 + j.1) then a else b)\n(hpolyabn : polyabn 0 = a ∧ polyabn 1 = b ∧ polyabn 2 = n)\n: Tendsto (fun x : ℝ => (Mn x).det / (x - a) ^ (2 * n - 2)) (\U0001D4DD[≠] a) (\U0001D4DD (MvPolynomial.eval polyabn putnam_1984_a3_solution))"

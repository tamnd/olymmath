    (hf : f = fun n ↦
      Set.ncard {A : Matrix (Fin n) (Fin n) ℤ |
      (∀ i j : Fin n, A i j ∈ ({-1, 0, 1} : Set ℤ)) ∧
      ∃ S : ℤ, ∀ ϕ : Perm (Fin n), ∑ i : Fin n, A i (ϕ i) = S}) :
    let (a1, b1, a2, b2, a3, b3, a4)

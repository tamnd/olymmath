text: |-
  theorem putnam_1986_a5
    (n : ℕ) (hn : 1 ≤ n)
    (f : Fin n → ((Fin n → ℝ) → ℝ))
    (hf : ∀ i, ContDiff ℝ 2 (f i))
    (C : Fin n → Fin n → ℝ)
    (hf' : ∀ i j : Fin n, ∀ x : Fin n → ℝ, fderiv ℝ (f i) x (Pi.single j 1) - fderiv ℝ (f j) x (Pi.single i 1) = C i j)
    : ∃ g : (Fin n → ℝ) → ℝ, ∀ i : Fin n, IsLinearMap ℝ (λ x ↦ f i x + fderiv ℝ g x (Pi.single i 1))

text: |-
  abbrev putnam_1988_a2_solution : Prop := sorry

  theorem putnam_1988_a2
      (f : ℝ → ℝ)
      (hf : f = fun x ↦ Real.exp (x ^ 2)) :
      putnam_1988_a2_solution ↔
      (∃ a b : ℝ,
        a < b ∧
        ∃ g : ℝ → ℝ,
          (∃ x ∈ Ioo a b, g x ≠ 0) ∧
          DifferentiableOn ℝ g (Ioo a b) ∧
          ∀ x ∈ Ioo a b, deriv (fun y ↦ f y * g y) x = (deriv f x) * (deriv g x))

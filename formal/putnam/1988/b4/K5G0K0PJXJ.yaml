text: "theorem putnam_1988_b4\n    (a : ℕ → ℝ)\n    (IsPosConv : (ℕ → ℝ) → Prop)\n    (IsPosConv_def : ∀ a' : ℕ → ℝ, IsPosConv a' ↔\n      (∀ n ≥ 1, a' n > 0) ∧\n      (∃ s : ℝ, Tendsto (fun N : ℕ => ∑ n : Set.Icc 1 N, a' n) atTop (\U0001D4DD s))) :\n    (IsPosConv a) → IsPosConv (fun n : ℕ => (a n) ^ ((n : ℝ) / (n + 1)))"

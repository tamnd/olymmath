text: "abbrev putnam_1990_a2_solution : Prop := sorry\n\ntheorem putnam_1990_a2\n  (numform : ℝ → Prop)\n  (hnumform : ∀ x : ℝ, numform x ↔ ∃ n m : ℕ, x = n ^ ((1 : ℝ) / 3) - m ^ ((1 : ℝ) / 3)) :\n  putnam_1990_a2_solution ↔\n  (∃ s : ℕ → ℝ,\n    (∀ i : ℕ, numform (s i)) ∧\n    Tendsto s atTop (\U0001D4DD (Real.sqrt 2)))"

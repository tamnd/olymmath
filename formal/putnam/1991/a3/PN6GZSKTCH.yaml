text: |-
  abbrev putnam_1991_a3_solution : Set (Polynomial ℝ) := sorry

  theorem putnam_1991_a3
    (p : Polynomial ℝ)
    (n : ℕ)
    (hn : n = p.degree)
    (hge : n ≥ 2) :
    p ∈ putnam_1991_a3_solution ↔
      (∃ r : ℕ → ℝ, (∀ i : Fin (n - 1), r i < r (i + 1)) ∧
      (∀ i : Fin n, p.eval (r i) = 0) ∧
      (∀ i : Fin (n - 1), (Polynomial.derivative p).eval ((r i + r (i + 1)) / 2) = 0))

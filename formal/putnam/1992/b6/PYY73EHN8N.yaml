text: |-
  theorem putnam_1992_b6
    (n : ℕ)
    (npos : 0 < n)
    (M : Set (Matrix (Fin n) (Fin n) ℝ))
    (h1 : 1 ∈ M)
    (h2 : ∀ A ∈ M, ∀ B ∈ M, Xor' (A * B ∈ M) (-A * B ∈ M))
    (h3 : ∀ A ∈ M, ∀ B ∈ M, (A * B = B * A) ∨ (A * B = -B * A))
    (h4 : ∀ A ∈ M, A ≠ 1 → ∃ B ∈ M, A * B = -B * A) :
    M.encard ≤ n ^ 2

text: |-
  abbrev putnam_1996_b3_solution : ℕ → ℕ := sorry

  theorem putnam_1996_b3
    (n : ℕ) (hn : n ≥ 2) :
    IsGreatest
    {k | ∃ x : ℕ → ℤ,
      (x '' (Finset.range n) = Set.Icc (1 : ℤ) n) ∧
      ∑ i : Fin n, x i * x ((i + 1) % n) = k}
    (putnam_1996_b3_solution n)

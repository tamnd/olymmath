text: |-
  abbrev putnam_1997_a6_solution : ℤ → ℤ → ℝ := sorry

  theorem putnam_1997_a6
    (n : ℤ)
    (hn : n > 0)
    (x : ℝ → (ℤ → ℝ))
    (hx0 : ∀ c, x c 0 = 0)
    (hx1 : ∀ c, x c 1 = 1)
    (hxk : ∀ c, ∀ k ≥ 0, x c (k + 2) = (c*(x c (k + 1)) - (n - k)*(x c k))/(k + 1))
    (S : Set ℝ)
    (hS : S = {c : ℝ | x c (n + 1) = 0}) :
    ∀ k : Set.Icc 1 n, x (sSup S) k = putnam_1997_a6_solution n k

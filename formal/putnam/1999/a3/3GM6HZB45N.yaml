text: "theorem putnam_1999_a3\n    (f : ℝ → ℝ)\n    (hf : f = fun x ↦ 1 / (1 - 2 * x - x ^ 2))\n    (a : ℕ → ℝ)\n    (hf' : ∀ᶠ x in \U0001D4DD 0, Tendsto (fun N : ℕ ↦ ∑ n ∈ Finset.range N, (a n) * x ^ n) atTop (\U0001D4DD (f x)))\n    (n : ℕ) :\n    ∃ m : ℕ, (a n) ^ 2 + (a (n + 1)) ^ 2 = a m"

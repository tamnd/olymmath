text: |-
  theorem putnam_2004_a4
    (n : ℕ) (npos : n > 0)
    (x : Fin n → ℝ)
    (avals : ℕ → (ℕ → Fin n → ℝ) → Prop)
    (havals : ∀ N a, avals N a ↔ ∀ (i : Fin N) (j : Fin n), (a i j = -1 ∨ a i j = 0 ∨ a i j = 1)) :
    ∃ (N : ℕ) (c : Fin N → ℚ) (a : ℕ → Fin n → ℝ),
      avals N a ∧
      (∏ i : Fin n, x i) = ∑ i : Fin N, c i * (∑ j : Fin n, a i j * x j) ^ n

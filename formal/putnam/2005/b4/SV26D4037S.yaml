text: |-
  theorem putnam_2005_b4
  (m n : ℤ)
  (mnpos : m > 0 ∧ n > 0)
  (f : ℤ → ℤ → ℕ)
  (hf : ∀ m' > 0, ∀ n' > 0, f m' n' = Set.encard {x : Finset.Icc 1 n' → ℤ | ∑ i : Finset.Icc 1 n', |x i| ≤ m'})
  : f m n = f n m

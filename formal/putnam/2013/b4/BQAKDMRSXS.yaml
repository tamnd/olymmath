text: |-
  theorem putnam_2013_b4
      (μ Var M : C(Icc (0 : ℝ) 1, ℝ) → ℝ)
      (hμ : ∀ f, μ f = ∫ x, f x)
      (hVar : ∀ f, Var f = ∫ x, (f x - μ f) ^ 2)
      (hM : ∀ f : C(Icc (0 : ℝ) 1, ℝ), IsGreatest (range <| abs ∘ f) (M f))
      (f g : C(Icc (0 : ℝ) 1, ℝ)) :
      Var (f * g) ≤ 2 * Var f * (M g) ^ 2 + 2 * Var g * (M f) ^ 2

text: |-
  theorem usa1982_p2 (m n : ℕ) (hm : 0 < m) (hn : 0 < n)
      (h : ∀ x y z : ℝ, x + y + z = 0 →
        (x ^ (m + n) + y ^ (m + n) + z ^ (m + n)) / (m + n) =
          (x ^ m + y ^ m + z ^ m) / m * ((x ^ n + y ^ n + z ^ n) / n)) :
      (m = 2 ∧ n = 3) ∨ (m = 3 ∧ n = 2) ∨ (m = 2 ∧ n = 5) ∨ (m = 5 ∧ n = 2)

text: |-
  abbrev does_exist_finite : Bool := true

  theorem usa1984_p2b :
      if does_exist_infinite then
        ∃ S : Set ℕ, S.Infinite ∧ (∀ x ∈ S, 0 < x) ∧
          ∀ s : Finset ℕ, s.Nonempty → ↑s ⊆ S → ∃ m : ℕ, m ^ s.card = ∏ x ∈ s, x
      else
        ¬ ∃ S : Set ℕ, S.Infinite ∧ (∀ x ∈ S, 0 < x) ∧
          ∀ s : Finset ℕ, s.Nonempty → ↑s ⊆ S → ∃ m : ℕ, m ^ s.card = ∏ x ∈ s, x

text: |-
  abbrev does_exist_14 : Bool := false

  theorem usa1986_p1a :
      if does_exist_14 then
        ∃ n : ℕ, 0 < n ∧
          ∀ i ∈ Finset.range 14, ∃ p : ℕ, p.Prime ∧ p < 13 ∧ p ∣ n + i
      else
        ¬ ∃ n : ℕ, 0 < n ∧
          ∀ i ∈ Finset.range 14, ∃ p : ℕ, p.Prime ∧ p < 13 ∧ p ∣ n + i

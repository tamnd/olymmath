text: |-
  abbrev does_exist_14 : Bool := false

  theorem usa1986_p1b :
      if does_exist_21 then
        ∃ n : ℕ, 0 < n ∧
          ∀ i ∈ Finset.range 21, ∃ p : ℕ, p.Prime ∧ p < 17 ∧ p ∣ n + i
      else
        ¬ ∃ n : ℕ, 0 < n ∧
          ∀ i ∈ Finset.range 21, ∃ p : ℕ, p.Prime ∧ p < 17 ∧ p ∣ n + i

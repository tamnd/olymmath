text: |-
  theorem usa1995_p5 {n : ℕ} [NeZero n] (G : SimpleGraph (Fin n))
      [DecidableRel G.Adj] (hG : G.CliqueFree 3) :
      ∃ P : Fin n,
        (#(G.edgeFinset.filter fun e => ∀ v ∈ e, ¬G.Adj P v) : ℝ)
          ≤ (#G.edgeFinset : ℝ) * (1 - 4 * #G.edgeFinset / n ^ 2)

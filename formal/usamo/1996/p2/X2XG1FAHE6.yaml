  theorem usa1996_p2 (S : Finset ℕ) (hS : ∀ s ∈ S, 0 < s) :
      ∃ T : Fin S.card → Set ℕ,
        (∀ i, T i ⊆ SubsetSums S) ∧
          (⋃ i, T i = SubsetSums S) ∧
            ∀ i, ∀ a ∈ T i, ∀ b ∈ T i, a ≤ 2 * b

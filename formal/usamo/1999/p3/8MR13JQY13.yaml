text: |-
  theorem usa1999_p3 (p : ℕ) (hp : p.Prime) (hp2 : 2 < p) (a b c d : ℤ)
      (ha : ¬ (p : ℤ) ∣ a) (hb : ¬ (p : ℤ) ∣ b) (hc : ¬ (p : ℤ) ∣ c) (hd : ¬ (p : ℤ) ∣ d)
      (h : ∀ n : ℤ, ¬ (p : ℤ) ∣ n →
        Int.fract (((n * a : ℤ) : ℝ) / (p : ℝ)) + Int.fract (((n * b : ℤ) : ℝ) / (p : ℝ)) +
        Int.fract (((n * c : ℤ) : ℝ) / (p : ℝ)) + Int.fract (((n * d : ℤ) : ℝ) / (p : ℝ)) = 2) :
      (p : ℤ) ∣ a + b ∧ (p : ℤ) ∣ c + d ∨
        (p : ℤ) ∣ a + c ∧ (p : ℤ) ∣ b + d ∨
          (p : ℤ) ∣ a + d ∧ (p : ℤ) ∣ b + c

text: |-
  abbrev lowestScore (A B C : ℕ) : ℕ := min (min (A * C) (3 * A * B)) (2 * B * C)

  theorem usa2000_p3 (A B C : ℕ) :
      IsLeast {s : ℕ | ∃ l ∈ plays A B C, score l = s} (lowestScore A B C) ∧
      ((plays A B C).filter (fun l ↦ score l = lowestScore A B C)).card =
        fewestWays A B C

text: |-
  theorem usa2002_p1
      {α : Type} [DecidableEq α] [Fintype α] (hs : Fintype.card α = 2002)
      (N : ℕ) (hN : N ≤ 2 ^ 2002) :
      ∃ f : Finset α → Color,
        ((∀ s1 s2 : Finset α, f s1 = f s2 → f (s1 ∪ s2) = f s1) ∧
         (Fintype.card
             { a : Finset α // f a = Color.red } = N))

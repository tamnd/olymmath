text: |-
  theorem usa2012_p2 (color : ZMod 432 → Fin 4)
      (hcolor : ∀ i, (Finset.univ.filter fun x => color x = i).card = 108) :
      ∃ (U : Finset (ZMod 432)) (t₁ t₂ t₃ : ZMod 432),
        U.card = 3 ∧
        (∀ x ∈ U, color x = 0) ∧
        (∀ x ∈ U, color (x + t₁) = 1) ∧
        (∀ x ∈ U, color (x + t₂) = 2) ∧
        (∀ x ∈ U, color (x + t₃) = 3) ∧
        (∀ x ∈ U, ∀ y ∈ U, arcDist x y = arcDist (x + t₁) (y + t₁)) ∧
        (∀ x ∈ U, ∀ y ∈ U, arcDist x y = arcDist (x + t₂) (y + t₂)) ∧
        (∀ x ∈ U, ∀ y ∈ U, arcDist x y = arcDist (x + t₃) (y + t₃))

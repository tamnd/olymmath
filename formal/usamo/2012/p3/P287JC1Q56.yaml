text: |-
  abbrev SolutionSet : Set ℕ := { n | 2 < n }

  theorem usa2012_p3 (n : ℕ) (hn : 1 < n) :
      n ∈ SolutionSet ↔ ∃ a : ℕ → ℤ, (∀ i, 1 ≤ i → a i ≠ 0) ∧
        ∀ k, 1 ≤ k → ∑ j ∈ Finset.Icc 1 n, (j : ℤ) * a (j * k) = 0

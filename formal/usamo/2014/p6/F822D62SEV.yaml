text: |-
  theorem usa2014_p6 :
      ∃ c : ℝ, 0 < c ∧
        ∀ a b n : ℕ, 0 < a → 0 < b → 0 < n →
          (∀ i ∈ range (n + 1), ∀ j ∈ range (n + 1), 1 < Nat.gcd (a + i) (b + j)) →
          (c * (n : ℝ)) ^ n < ((min a b : ℕ) : ℝ)

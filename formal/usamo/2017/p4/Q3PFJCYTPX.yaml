text: |-
  theorem usa2017_p4 (n : ℕ) (_hn : 0 < n) (c : Fin (2 * n) → Bool)
      (hred : (Finset.univ.filter (fun i => c i = true)).card = n)
      (l₁ l₂ : List (Fin (2 * n)))
      (hnod₁ : l₁.Nodup) (hlen₁ : l₁.length = n) (hred₁ : ∀ r ∈ l₁, c r = true)
      (hnod₂ : l₂.Nodup) (hlen₂ : l₂.length = n) (hred₂ : ∀ r ∈ l₂, c r = true) :
      wraps c l₁ ∅ = wraps c l₂ ∅

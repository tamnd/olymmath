text: |-
  abbrev solution_set : Set ℝ := Set.Ioo 0 (Real.sqrt 2)

  theorem usa2017_p5 (c : ℝ) :
    c ∈ solution_set ↔
    (0 < c ∧
      ∃ l : ℤ × ℤ → ℕ,
        (Set.range l).Finite ∧
        (∀ p, 0 < l p) ∧
        ∀ {p1 p2}, p1 ≠ p2 → (l p1 = l p2) →
            c ^ (l p1) ≤ dist p1 p2)

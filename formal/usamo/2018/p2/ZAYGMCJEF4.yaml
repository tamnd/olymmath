text: |-
  abbrev solution_set : Set (ℝ → ℝ) :=
    { f | ∃ k : ℝ, k ∈ Set.Icc (-1 / 2) 1 ∧ ∀ t : ℝ, 0 < t → f t = k / (t + 1) + (1 - k) / 3 }

  theorem usa2018_p2 (f : ℝ → ℝ) :
      f ∈ solution_set ↔
        (∀ x : ℝ, 0 < x → 0 < f x) ∧
          (∀ x y z : ℝ, 0 < x → 0 < y → 0 < z → x * y * z = 1 →
            f (x + 1 / y) + f (y + 1 / z) + f (z + 1 / x) = 1)

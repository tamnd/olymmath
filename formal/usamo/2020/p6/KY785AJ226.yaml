text: |-
  theorem usa2020_p6 {n : ℕ} (hn : 2 ≤ n) (x y : Fin n → ℝ)
      (hx : Antitone x) (hy : Antitone y)
      (hxs : ∑ i, x i = 0) (hys : ∑ i, y i = 0)
      (hx2 : ∑ i, x i ^ 2 = 1) (hy2 : ∑ i, y i ^ 2 = 1) :
      ∑ i, (x i * y i - x i * y (Fin.rev i)) ≥ 2 / Real.sqrt ((n : ℝ) - 1)

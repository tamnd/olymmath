text: |-
  abbrev solution_set : Set (ℝ+ → ℝ+) :=
    { f : ℝ+ → ℝ+ | ∃ c : ℝ+, f = fun x ↦ c / x }

  theorem usa2022_p3 (f : ℝ+ → ℝ+) :
    f ∈ solution_set ↔
      (∀ x y : ℝ+, f x = f (f (f x) + y) + f (x * f y) * f (x + y))

text: |-
  abbrev solution_set : Set (ℝ+ → ℝ+) := { fun x ↦ x + 1 }

  theorem usa2023_p2 (f : ℝ+ → ℝ+) :
      f ∈ solution_set ↔
      ∀ x y, f (x * y + (f x)) = x * (f y) + ⟨2, two_pos⟩

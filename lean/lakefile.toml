# The Lake package Olymmath (spec 08.3). om formal lakefile writes this file. Do not edit it by hand. The Mathlib Archive files are built from the Mathlib dependency.
name = "Olymmath"
defaultTargets = ["Compfiles", "IMOSLLean4", "Imo", "PutnamBench"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

# Compfiles, https://github.com/dwrensha/compfiles. Licence: Apache-2.0.
[[lean_lib]]
name = "Compfiles"
srcDir = "vendor/compfiles/1745e6ced3e6"
roots = ["ProblemExtraction"]
globs = ["ProblemExtraction.+", "Compfiles.+"]

# IMOSLLean4, https://github.com/mortarsanjaya/IMOSLLean4. Licence: Apache-2.0.
[[lean_lib]]
name = "IMOSLLean4"
srcDir = "vendor/imosllean4/883b0326e585"
roots = ["IMOSLLean4"]
globs = ["IMOSLLean4.+"]
leanOptions = {autoImplicit = true}

# formal-imo, https://github.com/google-deepmind/formal-imo. Licence: Apache-2.0.
[[lean_lib]]
name = "Imo"
srcDir = "vendor/formal-imo/a85d84b97c8e"
roots = []
globs = ["Imo.+"]

# PutnamBench, https://github.com/trishullab/PutnamBench. Licence: Apache-2.0.
[[lean_lib]]
name = "PutnamBench"
srcDir = "vendor/putnambench/a635813f5edf"
roots = []
globs = ["src.+"]

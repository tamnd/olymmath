  # Agent decision, not a person's review: an edition is the calendar year in which the stage is written, in January or February, so the olimpiada.ru school year Y is the edition Y+1. Each of the grades 9, 10 and 11 has one paper over two days, numbered G.1 to G.8 for 2011 to 2017 (four problems a day) and G.1 to G.10 for 2018 to 2024 (five a day). The olimpiada.ru and olympiads.mccme.ru papers show this: grade 11 for every year, and grades 9 and 10 for 2013, 2017, 2018 and 2023. The position of problem N of grade G is pG followed by N, as in ru-allrussian, so problem 10 of grade 9 is p910. 1993 is the earliest year in the seed data, not the founding year. The years 1993 to 2010 and 2025 on have no era, because no primary paper of those years was checked.

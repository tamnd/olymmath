  per_year: 25
  eras:
    - {from: 1999, to: 2004}
  languages: [en]
  sources: [chiuchang]
  description: The junior secondary part of the International Mathematics Competition (IMC). It started in Kaohsiung in 1999. It has an individual paper of 12 short problems and 3 long problems, and a team paper of 10 problems.


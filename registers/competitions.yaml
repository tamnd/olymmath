# The competition register. Each row is one competition. Spec 05.2 gives the groups and the codes.

# International, high school (01b section 2)

- code: imo
  name: International Mathematical Olympiad
  short: IMO
  group: international
  level: high-school
  organizer: IMO Board
  url: https://www.imo-official.org/
  first_year: 1959
  gaps: [1980]
  edition_form: year
  layout:
    - {paper: day1, name: Day 1, positions: [p1, p2, p3]}
    - {paper: day2, name: Day 2, positions: [p4, p5, p6]}
  per_year: 6
  official_solutions: false
  copyright: Footer says "© International Mathematical Olympiad". No licence stated.
  sources: [imo-official, aops-collections, hf-mathnet, hf-numina-olympiads, hf-matharena, kalva, imomath, evanchen, compfiles, mathlib-archive-imo, formal-imo, minif2f-v2]
  description: The world championship of mathematics for secondary school students. Each country sends a team of up to six students, who write two papers of three problems on two days.

- code: isl
  name: IMO Shortlist
  short: ISL
  group: international
  level: high-school
  organizer: IMO Board
  url: https://www.imo-official.org/problems.aspx
  edition_form: year
  official_solutions: true
  languages: [en]
  copyright: Embargoed until the next IMO.
  sources: [imo-official, hf-numina-olympiads, kalva, aops-collections, imosllean4]
  description: The list of about 30 problems from which the IMO jury picks the six IMO problems. It stays confidential until the end of the next IMO.

- code: igo
  name: Iranian Geometry Olympiad
  short: IGO
  group: international
  level: high-school
  url: https://igo-official.com/
  first_year: 2014
  edition_form: year
  per_year: 15
  official_solutions: true
  languages: [en, fa]
  copyright: None stated.
  sources: [igo-official]
  description: An international geometry olympiad with three levels of five problems each. The official booklets have solutions.

- code: kangaroo
  name: Mathematical Kangaroo
  group: international
  organizer: AKSF
  url: https://www.aksf.org/
  first_year: 1991
  edition_form: year
  copyright: Varies by country. Thales Cyprus forbids publication of its English papers.
  sources: [hf-matharena]
  description: A multiple choice contest for school students in about six levels. National organizers publish the papers, and only answers are official.

- code: tot
  name: Tournament of Towns

- code: ill
  name: IMO Longlist
  short: ILL
  group: international
  level: high-school
  organizer: IMO Board
  url: https://www.imo-official.org/
  edition_form: year
  # Agent decision, not a person's review: the longlist of a year has its own numbers, which are not the numbers of the shortlist, so it has its own code. The size of a longlist changes from year to year, so the register gives no positions.
  eras:
    - {from: 1959}
  official_solutions: false
  languages: [en]
  copyright: None stated.
  sources: [hf-aops-wiki, hf-ai-mo-aops]
  description: The list of all problems that the countries proposed for an IMO. The jury chose the shortlist from it. The longlists of the early years are public.

- code: igo
  name: Iranian Geometry Olympiad
  short: IGO
  group: international
  level: high-school
  levels: [junior, high-school]
  url: https://igo-official.com/
  first_year: 2014
  edition_form: year
  layout:
    - {paper: elementary, name: Elementary, level: junior, positions: [e1, e2, e3, e4, e5]}
    - {paper: intermediate, name: Intermediate, positions: [i1, i2, i3, i4, i5]}
    - {paper: advanced, name: Advanced, positions: [a1, a2, a3, a4, a5]}
  per_year: 15
  eras:
    - {from: 2014, to: 2014, per_year: 10, layout: [{paper: junior, name: Junior, positions: [j1, j2, j3, j4, j5]}, {paper: senior, name: Senior, positions: [s1, s2, s3, s4, s5]}]}
  official_solutions: true
  languages: [en, fa]
  copyright: None stated.
  sources: [igo-official]
  description: An international geometry olympiad with three levels of five problems each. The Elementary level is for grades 7 and 8 and below, the Intermediate level for grades 9 and 10, and the Advanced level for grades 11 and 12. The official booklets have solutions.

- code: kangaroo
  name: Mathematical Kangaroo
  group: international
  level: high-school
  levels: [elementary, junior, high-school]
  organizer: AKSF
  url: https://www.aksf.org/
  first_year: 1991
  edition_form: year
  copyright: Varies by country. Thales Cyprus forbids publication of its English papers.
  sources: [hf-matharena, mathkangaroo-usa]
  description: A multiple choice contest for school students in about six levels. National organizers publish the papers, and only answers are official. Math Kangaroo USA runs it in the United States for grades 1 to 12, and Canada, Mexico, Brazil, Argentina and other countries of the Americas have their own editions.

- code: tot
  name: Tournament of Towns
  short: ToT
  names: {ru: Турнир городов}
  group: international
  level: high-school
  levels: [junior, high-school]
  url: https://www.turgor.ru/en/problems/
  first_year: 1980
  edition_form: year-season
  languages: [ru, en]
  copyright: None stated.
  sources: [turgor, problems-ru]
  description: A contest held in many towns in two rounds a year, each with two tiers and two levels. problems.ru holds 1,854 of its problems. An edition is a round, named by the year in which it is held, as in 2024-fall and 2025-spring. A position is the tier (j for juniors in grades 7-8 or 8-9, s for seniors in grades 9-10 or 10-11), the level (o for the base, training or preparatory paper, a for the hard or main paper) and the problem number, as in tot/2024-fall/sa3.

- code: iom
  name: International Olympiad of Metropolises
  short: IOM
  group: international
  level: high-school
  first_year: 2016
  edition_form: year
  per_year: 6
  languages: [en, ru]
  sources: [imomath]
  description: An olympiad for teams from large cities. No official site has been found.


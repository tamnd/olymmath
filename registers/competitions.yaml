# Journals with problem sections (01b section 5). They are source kinds, not competitions.

- code: journal-crux
  name: Crux Mathematicorum
  short: Crux
  group: journal
  level: open
  organizer: CMS
  url: https://cms.math.ca/publications/crux/
  first_year: 1975
  languages: [en, fr]
  copyright: "Personal and private use only. All other rights are reserved."
  sources: [crux]
  description: The problem journal of the CMS, with about 5,000 proposals and the Olympiad Corner. It is open access from 2019.

- code: journal-komal
  name: KöMaL
  short: KöMaL
  names: {hu: Középiskolai Matematikai és Fizikai Lapok}
  group: journal
  level: open
  url: https://www.komal.hu/
  first_year: 1894
  languages: [hu, en]
  copyright: Copyright KöMaL.
  sources: [komal]
  description: The Hungarian school mathematics journal, with English problem statements for more than 40 years.

- code: journal-kvant
  name: Kvant Problem Section
  short: Kvant
  names: {ru: Задачник «Кванта»}
  group: journal
  level: open
  first_year: 1970
  languages: [ru]
  sources: [kvant]
  description: The problem section of the Russian journal Kvant, with about 3,000 problems.

- code: journal-excalibur
  name: Mathematical Excalibur
  group: journal
  level: open
  organizer: HKUST
  url: https://www.math.hkust.edu.hk/excalibur/
  first_year: 1995
  languages: [en, zh]
  sources: [excalibur]
  description: The free newsletter of HKUST, with a problem corner of about 800 problems.

- code: journal-tzaloa
  name: Tzaloa
  group: journal
  level: open
  url: https://www.ommenlinea.org/
  first_year: 2009
  languages: [es]
  sources: [tzaloa]
  description: The magazine of the Mexican olympiad.

- code: journal-eureka
  name: Eureka!
  names: {pt: Eureka!}
  group: journal
  level: open
  url: https://www.obm.org.br/
  first_year: 1998
  last_year: 2015
  languages: [pt]
  sources: [eureka]
  description: The magazine of the Brazilian olympiad from 1998 to 2015. It published the OBM solutions.

- code: journal-amm
  name: American Mathematical Monthly Problems
  short: AMM
  group: journal
  level: open
  organizer: MAA
  first_year: 1894
  languages: [en]
  copyright: Copyright MAA. Paywalled.
  sources: [amm]
  description: The problem section of the American Mathematical Monthly, with about 12,000 problems. It is paywalled, so olymmath keeps the locator and a link only.

- code: journal-mr
  name: Mathematical Reflections
  group: journal
  level: open
  organizer: AwesomeMath
  url: https://www.awesomemath.org/mathematical-reflections/
  first_year: 2006
  languages: [en]
  copyright: Copyright AwesomeMath. All rights reserved.
  sources: [mathreflections]
  description: A free online journal started by Titu Andreescu, with about 3,000 problems.

- code: journal-gazeta

  first_year: 1961
  # Agent decision, not a person's review: from 1993 the final round has eight problems for each of the grades 9, 10 and 11, four on each of two days. The AoPS wiki titles name the grade and the problem, as in "All Russian 2021/9.4", "Russian Olympiad 2004 problem 10.6" or "All Russian 2014 Grade 9 Day 2 P4", where a day counts its problems from 1. The position of problem N of grade G is pG followed by N, as the records of 1993 to 2014 already use. 2007 has no era, because problems.ru also gives it a grade 8 paper, and 2020 has none, because the final round was not held.

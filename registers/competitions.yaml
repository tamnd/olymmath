- code: pumac
  name: Princeton University Mathematics Competition
  short: PUMaC
  group: usa
  level: high-school
  country: US
  url: https://pumac.princeton.edu/archives
  edition_form: year
  # Agent decision, not a person's review: each subject test of PUMaC has an A paper and a B paper, and each one is its own paper here, with the positions aa1 to aa8 for Algebra A, ab1 to ab8 for Algebra B, and so on (c for Combinatorics, g for Geometry, n for Number Theory, f for the Individual Finals, t for the Team Round). The counts come from the problem PDFs of the official archive. The A and B papers share some problems at other numbers, so one record can have an appearance in each division. The Power Round (long proofs in many parts, with no clear numbering) and the Live Round (2016 to 2019) are left out. The Team Rounds of 2009 to 2012 are crossword and sudoku puzzles with no numbered problems, so these years have no team positions. The archive has no papers of 2006, so 2006 has no layout. The numbers of the Team Round problems in 2017 and 2018 start at an example problem 0, which is not a position.

  sources: [berkeley-mt]
  # Agent decision, not a person's review: each round of a year is its own paper, as on the archive pages of berkeley.mt. The number of problems of each round was counted in the round PDF. A position is the prefix of the round and the number of the problem in the round: i individual, t team, an analysis, d discrete, g geometry, a algebra, k calculus, c combinatorics, nt number theory, ge general, u guts. The subject tests of 2013 to 2015 (analysis, discrete and geometry) have ten short-answer problems and two proof problems, P1 and P2, with the positions an1 to an10, anp1 and anp2, and so on. The guts round of 2021 to 2025 and the team round of 2020 have nine sets of three problems, numbered 1 to 27. The power round is not in the layout, because its parts and sub-parts have no fixed numbers. The tiebreakers are not in the layout. The tournament round of 2012 is not in the layout, because its numbers restart in each of its sub-rounds.

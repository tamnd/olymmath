  languages: [ru, en]
  copyright: None stated.
  sources: [turgor, problems-ru]
  description: A contest held in many towns in two rounds a year, each with two tiers and two levels. problems.ru holds 1,854 of its problems.

- code: iom
  name: International Olympiad of Metropolises
  short: IOM

# Open problem sets (group benchmark). Their texts were written for the set and carry an open licence, so they may be Z1. They are not competitions and have no shape, so they do not count in C0.

- code: amo-bench
  name: AMO-Bench
  short: AMO-Bench
  group: benchmark
  level: open
  organizer: Meituan LongCat
  url: https://github.com/meituan-longcat/AMO-Bench
  first_year: 2025
  languages: [en]
  copyright: MIT licence (https://github.com/meituan-longcat/AMO-Bench/blob/main/LICENSE).
  sources: [hf-amo-bench]
  description: A set of 50 new problems at olympiad level, written by experts for the evaluation of language models.

- code: nemotron-imo-bench

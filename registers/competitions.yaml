    - {paper: number-theory-b, name: Number Theory B, positions: [nb1, nb2, nb3, nb4, nb5, nb6, nb7, nb8]}
    - {paper: finals-a, name: Individual Finals A, positions: [fa1, fa2, fa3]}
    - {paper: finals-b, name: Individual Finals B, positions: [fb1, fb2, fb3]}
    - {paper: team, name: Team, positions: [t1, t2, t3, t4, t5, t6, t7, t8, t9, t10, t11, t12, t13, t14, t15]}

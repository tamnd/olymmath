  url: https://bilimolimpiyatlari.tubitak.gov.tr/
  first_year: 1996
  # Agent decision, not a person's review: this row counts the written second round (İkinci Aşama). An edition is the year of the olympiad season. The paper is usually written in November or December, but the 2021 paper was written on 7 January 2022. The TÜBİTAK papers of 2010 to 2015, 2017, 2019, 2021, 2023 and 2025 have four problems on one paper of four and a half hours. The 2010 paper is the 15th olympiad, so the first was in 1996. The TÜBİTAK archive has no second-round paper for 2016, so 2016 has no era. The years 1996 to 2009 have no era, because no primary paper of those years was checked. The first round is a multiple-choice test and is not counted here.
  eras:
    - {from: 2010, to: 2015, per_year: 4}
    - {from: 2017, to: 2025, per_year: 4}
  edition_form: year
  languages: [tr]
  sources: [tubitak, hf-mathnet]
  description: The national olympiad of Turkey for middle-school students, with a multiple-choice first round and a written second round. TÜBİTAK gives the papers of recent years. The shape of the second round is confirmed for 2010 to 2015 and 2017 to 2025.


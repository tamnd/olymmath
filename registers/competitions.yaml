  languages: [en]
  copyright: CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).
  sources: [hf-nemotron-imo-bench]
  description: A set of proof problems at IMO level in algebra, combinatorics, geometry and number theory.

- code: gaic-math

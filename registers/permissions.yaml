# Permission requests to rights holders (spec 11.4 of olymmath-agent).
# One row per rights holder behind a Z2 or Z3 source or competition. Aggregators
# (Hugging Face datasets, MathNet, Wikipedia, Reddit, books, archive sites such
# as klasirane, toanmath or olimpiada.ru) have no row: their texts are copies,
# and the rights holders are the competitions they copy.
# This register never changes a zone. A grant is applied by its own change of
# registers/sources.yaml with the licence permission:<id>.
# Contacts come only from the holders' official sites; no contact means none was
# found yet. The owner sends each letter (docs/permission-letter.md in
# olymmath-agent); agents only prepare rows. Drafted 2026-11-16; the record
# counts in the notes are at drafting.

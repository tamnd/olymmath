- id: problems-ru
  name: problems.ru
  kind: curated
  origin: H2
  url: https://problems.ru/
  access: html
  crawl_delay: 20
  terms: 'The copyright page (about_system.php#copyright, read on 2026-11-07 and again on 2026-11-08) allows free use for personal non-commercial purposes and in lessons and circles, and asks a site that shows a problem to link to problems.ru and give its unique number. But publication on paper or electronic media needs the permission of the authors, the publishers or MCCME, the topic rubrics and the difficulty tables belong to MCCME, and all rights are reserved. That is not a clear licence for the text, so the content links to each problem page and holds no text.'
  zone:
    statement: Z3
    solution: Z3
  ai_train: unknown
  size: about 21k problems, 8,157 from olympiads
  wave: 1
  state: active
  notes: 'robots.txt (checked on 2026-11-07) disallows /feedback.php?, /show_document.php? (the pictures) and the basket links, and asks for 20 s between requests. om seed problems-ru walks one olympiad node of the source catalogue and reads the listing of the paper of each grade, which gives the number of each problem. om links then writes a link-only problem for each new position, named by the problems.ru number. The topics and the difficulty are not copied. The second day of a grade numbers its problems from 1 again, so its positions are dG followed by N (ru-moscow/2025/d113). A problem with a picture gets a link too; the picture is never fetched. A year in which two problems would get the same position is left out. Some listings write the number as year.grade.number, as in (#2010.8.1). The listings before 2005 and of 2006 give no numbers, so om seed -details reads the number of each problem from the table of sources on its own page (one request a problem), and only when the table gives one number in the year and the grade of the paper. Done: the Moscow MO of 1978 to 2025, except the two variants A and B of grade 11 in 2005. Before 1991 the grades are 7 to 10. In 1975 to 1977 the papers are rounds of a grade ("10 класс, 1 тур"), which have no position form yet, so they are left out. The final round of the Sharygin olympiad, whose listings number the problems as grade.number (#8.1), gives pGN as in sharygin/2019/p81; its correspondence round ("Заочный тур") names no grade and is left out. From 2021 the final round listings give no numbers, so they come from the page of each problem, which writes them as grade.number (10.4). In 2006 to 2009 the papers are named "8 Класс". The pages of 2005 write the number as a plain number, and those of 2006 and 2007 as grade and number with no dot (106 is problem 6 of grade 10). Done for Sharygin: the final rounds of 2005 to 2007, 2009 to 2019 and 2021 to 2025, where a position that the content already holds from AoPS is not touched. 2008 and 2020 have only the correspondence round on problems.ru. The Tournament of Towns gives rows with an edition, the round of the year in which it is held (tot/2024-fall, tot/2025-spring), and a position of tier, level and number: j for grades 7-8 or 8-9, s for grades 9-10 or 10-11, o for the base, training or preparatory paper, a for the hard or main paper, as in tot/2024-fall/sa3. A year node such as "46 турнир (2024/2025 год)" gives the fall round of 2024 and the spring round of 2025. The papers with no variant, the variant for Moscow pupils and the oral round are left out. A problem that the junior and the senior paper share has one page, so it gets one record with both appearances. The spring hard paper often shares problems with the Moscow MO; a page that the content already links from a Moscow record is left out of the Tournament of Towns for now (111 in 2000 to 2025). Some spring papers of 2018 end in "классы". The fall hard senior paper of 2015 is named "осенний тур, сложный вариант, 10-11 класс ()" and is left out. Done for the Tournament of Towns: the tournaments 21 to 47 (fall 1999 to spring 2026). The tournaments 1 to 20 are left; some of their papers are named "тренировочный", "основной" or "подготовительный" вариант, which om seed reads (o, a, o), and some name no variant and are left out. For the All-Russian olympiad the year nodes "1992-1993" to "2016-2017" count by their last year, and om seed opens "Заключительный этап" and reads its grade papers, whose listings write the number as (#04.5.9.1): two digits of the year, the stage, the grade and the number. That gives pGN as in ru-allrussian/2004/p91; a problem that two grades share gets one record with both appearances. The regional round is left out. 2003, 2010, 2011, 2015, 2016 and 2017 are left out because the content holds flat pN records from AoPS in those years, which may be the same problems. The listings of 2009 write the year as 06, which does not fit the paper, so 2009 is left out. Done for the All-Russian olympiad: the final rounds of 1993 to 2002, 2004 to 2008 and 2012 to 2014. The Lomonosov tournament: the year nodes named "44 (2021), математика" hold one list for all grades, numbered (#1) to (#N), which gives pN as in ru-lomonosov/2021/p3. The nodes with no subject (1978 to 1994 and 2004 to 2006) and the game nodes ("математические игры") are left out, and so are 2023 and 2024, whose listings give no number. Done for the Lomonosov tournament: 1995 to 2003, 2007 to 2022 and 2025. Left for later: the older tournaments of the Tournament of Towns, the All-Russian years above, the rest of the Lomonosov tournament, the Moscow MO before 1978 and the other olympiads, at about four minutes a year, or about eight with -details. Ask MCCME for Z1 or Z2 (11.4).'


note: 'Agent decision, not a person''s review. ru-allrussian gets grade eras from 1993: grades 9, 10 and 11 with eight problems each, four on each of two days. The AoPS wiki titles give the grade and the number, as in "All Russian 2021/9.4" or "All Russian 2014 Grade 9 Day 2 P4". 81 of the 2015 to 2023 placements were checked against the official final round papers at olympiads.mccme.ru/vmo, and all agree; the others have too few numbers and letters to compare. 2009, 2003 and 2006 have no official paper on that site, so they rest on the titles alone. Ten records with a flat number move to their grade position, found in the official papers or in the pairs that the import gave. 2003/p118 was left out, because its title names Serbia and Montenegro. Titles that name two grades, such as "ARO 2021 10.7/9.7", give no position, so those shared problems are still missing.'
